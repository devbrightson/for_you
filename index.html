<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Joyeux Anniversaire Marcello 🌸</title>
<style>
:root{
  --void:#040009;
  --mag:#ff2d8a;
  --rose:#ff79bc;
  --soft:#ffd6ee;
  --gold:#ffd770;
  --glow:#fff5fb;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;
  background:var(--void);
  overflow:hidden;
  font-family:'Georgia',serif;
  touch-action:none;
  user-select:none;
}

#stage{
  position:relative;
  width:100%;height:100vh;
  overflow:hidden;
  cursor:grab;
}
#stage.dragging{cursor:grabbing;}

/* world canvas (galaxy) */
#worldCanvas{
  position:absolute;top:0;left:0;
  image-rendering:pixelated;
}

/* floating message nodes */
#nodesLayer{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}

.msg-node{
  position:absolute;
  pointer-events:auto;
  cursor:pointer;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  animation:nodePulse 3s ease-in-out infinite;
}
.msg-node:nth-child(2){animation-delay:0.6s;}
.msg-node:nth-child(3){animation-delay:1.2s;}
.msg-node:nth-child(4){animation-delay:1.8s;}
.msg-node:nth-child(5){animation-delay:2.4s;}

@keyframes nodePulse{
  0%,100%{transform:translate(-50%,-50%) translateY(0px) scale(1);}
  50%    {transform:translate(-50%,-50%) translateY(-7px) scale(1.04);}
}

.node-orb{
  width:52px;height:52px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  background:radial-gradient(circle at 35% 35%,rgba(255,180,220,0.35),rgba(160,32,240,0.15));
  border:1.5px solid rgba(255,121,188,0.55);
  box-shadow:
    0 0 16px rgba(255,45,138,0.5),
    0 0 40px rgba(255,45,138,0.2),
    inset 0 0 12px rgba(255,121,188,0.15);
  transition:transform 0.2s, box-shadow 0.2s;
}
.msg-node:hover .node-orb,
.msg-node.touched .node-orb{
  transform:scale(1.15);
  box-shadow:
    0 0 28px rgba(255,45,138,0.8),
    0 0 60px rgba(255,45,138,0.4),
    inset 0 0 18px rgba(255,121,188,0.3);
}
.msg-node.read .node-orb{
  border-color:rgba(255,215,112,0.65);
  box-shadow:0 0 18px rgba(255,215,112,0.5),0 0 40px rgba(255,215,112,0.2);
}

.node-num{
  font-size:1.3rem;font-weight:700;
  color:var(--glow);
  text-shadow:0 0 10px rgba(255,45,138,0.8);
  line-height:1;
}

/* orbit ring */
.node-orb::before{
  content:'';position:absolute;
  width:68px;height:68px;
  border-radius:50%;
  border:1px solid rgba(255,121,188,0.2);
  animation:orbitRing 4s linear infinite;
}
@keyframes orbitRing{
  0%  {transform:rotate(0deg) scaleX(1);}
  50% {transform:rotate(180deg) scaleX(0.6);}
  100%{transform:rotate(360deg) scaleX(1);}
}

/* check mark for read nodes */
.node-check{
  position:absolute;top:-6px;right:-6px;
  width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,#ffd770,#ff79bc);
  display:flex;align-items:center;justify-content:center;
  font-size:0.55rem;color:#fff;font-weight:700;
  opacity:0;transform:scale(0);
  transition:opacity 0.3s,transform 0.3s;
  box-shadow:0 0 8px rgba(255,215,112,0.6);
}
.msg-node.read .node-check{opacity:1;transform:scale(1);}

.node-label{
  margin-top:7px;
  font-size:0.58rem;letter-spacing:0.15em;
  text-transform:uppercase;
  color:rgba(255,210,235,0.75);
  text-shadow:0 0 8px rgba(255,45,138,0.5);
  white-space:nowrap;
  pointer-events:none;
}

/* floating orbit text labels */
.olabel{
  position:absolute;
  pointer-events:none;
  color:rgba(255,224,242,0.75);
  font-size:0.62rem;letter-spacing:0.13em;
  text-transform:uppercase;
  text-shadow:0 0 9px rgba(255,45,138,0.6);
  white-space:nowrap;font-weight:700;
}

/* ambient petals */
.petal{
  position:fixed;pointer-events:none;z-index:2;
  animation:petalUp linear infinite;opacity:0;
}
@keyframes petalUp{
  0%  {transform:translateY(0) rotate(0deg);opacity:0;}
  6%  {opacity:1;}
  90% {opacity:0.6;}
  100%{transform:translateY(-110vh) rotate(30deg);opacity:0;}
}

/* ── home overlay ── */
#homeOverlay{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(4,0,9,0.0);
  pointer-events:auto;
  transition:opacity 0.8s ease;
}
#homeOverlay.hiding{opacity:0;pointer-events:none;}
#homeOverlay.gone{display:none;}

.home-eyebrow{
  font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;
  color:rgba(255,214,238,0.7);margin-bottom:0.55rem;
  opacity:0;animation:riseIn 1.4s ease forwards 0.35s;
}
.home-title{
  font-family:'Brush Script MT','Segoe Script',cursive;
  font-size:clamp(1.8rem,8vw,3rem);color:var(--glow);
  text-shadow:0 0 14px rgba(255,121,188,0.95),0 0 32px rgba(255,45,138,0.75),0 0 60px rgba(160,32,240,0.55);
  line-height:1.1;text-align:center;
  opacity:0;animation:riseIn 1.6s ease forwards 0.65s;
}
.home-name{
  display:block;font-size:clamp(2.6rem,12vw,4.4rem);margin-top:0.1rem;
  background:linear-gradient(120deg,#fff5fb 0%,#ff79bc 35%,#ffd770 65%,#fff5fb 100%);
  background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(255,45,138,0.55));
  animation:riseIn 1.6s ease forwards 0.65s, shimmer 5s linear infinite 2.3s;
  opacity:0;
}
.home-sub{
  font-size:0.78rem;color:rgba(255,210,235,0.7);
  margin-top:1rem;letter-spacing:0.05em;text-align:center;
  width:80%;
  opacity:0;animation:riseIn 1.4s ease forwards 1.1s;
}
.btn-explore{
  margin-top:1.8rem;
  padding:0.9rem 2.4rem;border-radius:999px;
  border:1px solid rgba(255,121,188,0.55);
  background:rgba(12,2,16,0.65);
  color:var(--soft);font-size:0.84rem;letter-spacing:0.1em;
  backdrop-filter:blur(8px);cursor:pointer;
  opacity:0;animation:riseIn 1.4s ease forwards 1.6s;
  transition:transform 0.25s,box-shadow 0.25s,background 0.25s;
}
.btn-explore:hover{
  transform:translateY(-4px);
  background:rgba(255,45,138,0.16);
  box-shadow:0 10px 34px rgba(255,45,138,0.32);
}
@keyframes riseIn{
  from{opacity:0;transform:translateY(13px) scale(0.94);}
  to  {opacity:1;transform:translateY(0) scale(1);}
}
@keyframes shimmer{
  0%  {background-position:0% 50%;}
  100%{background-position:300% 50%;}
}

/* ── hint ── */
#hint{
  position:fixed;bottom:7%;left:50%;transform:translateX(-50%);
  z-index:10;
  color:rgba(255,210,235,0.55);font-size:0.65rem;letter-spacing:0.15em;
  text-transform:uppercase;text-align:center;
  pointer-events:none;
  opacity:0;transition:opacity 1s;
}
#hint.show{opacity:1;}

/* progress bar */
#progress{
  position:fixed;top:5%;left:50%;transform:translateX(-50%);
  z-index:10;display:flex;align-items:center;gap:0.5rem;
  opacity:0;transition:opacity 0.6s;
}
#progress.show{opacity:1;}
.pdot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,121,188,0.3);
  border:1px solid rgba(255,121,188,0.5);
  transition:background 0.4s,transform 0.4s;
}
.pdot.done{
  background:rgba(255,215,112,0.8);
  transform:scale(1.2);
  box-shadow:0 0 8px rgba(255,215,112,0.6);
}

/* ── message popup ── */
#popup{
  position:fixed;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  background:rgba(4,0,9,0.82);
  backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;
  transition:opacity 0.4s ease;
}
#popup.show{opacity:1;pointer-events:auto;}

.popup-card{
  width:88%;max-width:400px;
  max-height:80vh;overflow-y:auto;
  background:linear-gradient(150deg,rgba(32,4,28,0.97),rgba(7,1,12,0.98));
  border:1px solid rgba(255,121,188,0.42);border-radius:22px;
  padding:1.9rem 1.7rem 1.7rem;text-align:center;
  box-shadow:0 0 80px rgba(255,45,138,0.22),0 0 40px rgba(160,32,240,0.14);
  transform:scale(0.88) translateY(16px);
  transition:transform 0.45s cubic-bezier(.22,.61,.36,1);
}
.popup-card.photo-popup-card{
  width:92%;max-width:700px;max-height:90vh;
}
#popup.show .popup-card{transform:scale(1) translateY(0);}

.popup-icon{font-size:1.8rem;margin-bottom:0.6rem;}
.popup-num{
  font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;
  color:rgba(255,121,188,0.6);margin-bottom:0.4rem;
}
.popup-title{
  font-family:'Brush Script MT','Segoe Script',cursive;
  font-size:1.65rem;line-height:1.2;
  background:linear-gradient(120deg,#ff79bc,#ffd770);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:0.8rem;
}
.popup-body{
  font-size:0.85rem;line-height:1.72;
  color:rgba(255,245,251,0.9);
  text-align:left;
}
.photo-popup-image{
  width:auto;height:auto;max-width:100%;max-height:65vh;
  object-fit:contain;object-position:center;
  display:block;margin:0 auto 0.8rem;border-radius:14px;
}
.popup-body.center{text-align:center;}
.popup-divider{
  width:40%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,121,188,0.5),transparent);
  margin:0.85rem auto;
}
.popup-signature{
  font-family:'Brush Script MT','Segoe Script',cursive;
  font-size:1.15rem;color:#ffb6dd;
  text-align:right;margin-top:0.5rem;margin-bottom:1rem;
}
.popup-nav{
  display:flex;gap:0.65rem;justify-content:center;
  margin-top:1rem;flex-wrap:wrap;
}
.btn-pop{
  padding:0.52rem 1.35rem;border-radius:999px;
  border:1px solid rgba(255,121,188,0.48);
  background:transparent;color:var(--glow);
  font-size:0.78rem;letter-spacing:0.07em;cursor:pointer;
  transition:background 0.2s,transform 0.18s;
  white-space:nowrap;
}
.btn-pop:hover{background:rgba(255,45,138,0.14);transform:translateY(-2px);}
.btn-pop.primary{background:rgba(255,45,138,0.18);border-color:rgba(255,121,188,0.65);}
.btn-pop.primary:hover{background:rgba(255,45,138,0.30);}
</style>
</head>
<body>

<!-- home overlay -->
<div id="homeOverlay">
  <div class="home-eyebrow">✨ 19 Septembre ✨</div>
  <div class="home-title">
    Joyeux Anniversaire
    <span class="home-name">Marcello 🌸</span>
  </div>
  <div class="home-sub">5 messages t'attendent dans cette galaxie.<br>Explore, trouve-les et lis-les tous. 💌</div>
  <button class="btn-explore" id="btnExplore">Explorer la galaxie 🚀</button>
</div>

<!-- main stage -->
<div id="stage">
  <canvas id="worldCanvas"></canvas>
  <div id="nodesLayer"></div>
  <div id="orbitLabels"></div>
</div>

<!-- ambient petals -->
<div id="petalsLayer"></div>

<!-- hint -->
<div id="hint">✦ Fais glisser pour explorer · Clique sur les ✦ pour lire</div>

<!-- progress -->
<div id="progress">
  <div class="pdot" id="pd1"></div>
  <div class="pdot" id="pd2"></div>
  <div class="pdot" id="pd3"></div>
  <div class="pdot" id="pd4"></div>
  <div class="pdot" id="pd5"></div>
</div>

<!-- message popup -->
<div id="popup">
  <div class="popup-card">
    <div class="popup-icon" id="popIcon"></div>
    <div class="popup-num"  id="popNum"></div>
    <div class="popup-title" id="popTitle"></div>
    <div id="popBody"></div>
    <div class="popup-nav" id="popNav"></div>
  </div>
</div>

<script>
(function(){

// ═══════════════════════════════════════════════════════
// MESSAGES DATA
// ═══════════════════════════════════════════════════════
// PHOTO 1 — PASTE BASE64 HERE
const PHOTO_1 = {
  icon: '📷',
  title: "Notre souvenir",
  photo: "https://drive.google.com/thumbnail?id=1Hmybb_d3B3sILAQXrx8fjPoB-yzBVqzD&sz=w2000",
  body: "<p class='popup-body'>Notre premier souvenir ❤️</p>",
  label: "Photo 1",
  isPhoto: true
};

// PHOTO 2 — PASTE BASE64 HERE
const PHOTO_2 = {
  icon: '📷',
  title: "Souvenir de l'université",
  photo: "https://drive.google.com/thumbnail?id=1jEZuyLBgxx5U9EWPoFw1E8zVsvJMjqd0&sz=w2000",
  body: "<p class='popup-body'>Un souvenir que je n'oublierai jamais ❤️</p>",
  label: "Photo 2",
  isPhoto: true
};

const MESSAGES = [
  {
    icon:'🌌',
    title:'Celle qu\'on ne peut pas oublier',
    body:`<p class="popup-body">Il y a des personnes qu'on rencontre à l'université et qu'on oublie dès la fin du semestre. Et puis il y a toi — celle qu'on ne peut pas oublier, même si on essayait.</p>`,
    label:'Message I'
  },
  {
    icon:'💫',
    title:'Ma meilleure complice',
    body:`<p class="popup-body">Tu es ma meilleure amie, ma complice, celle avec qui les journées les plus ordinaires deviennent des souvenirs qu'on garde. Je suis tellement reconnaissant que nos chemins se soient croisés.</p>`,
    label:'Message II'
  },
  {
    icon:'💖',
    title:'L\'honnêteté d\'aujourd\'hui',
    body:`<p class="popup-body">Je vais être honnête — parce qu'aujourd'hui, le jour de ton anniversaire, tu mérites l'honnêteté : tu es bien plus que ma meilleure amie. Tu es celle à qui je pense, celle qui me manque quand elle n'est pas là, celle qui me fait sourire sans même le faire exprès.</p>`,
    label:'Message III'
  },
  {
    icon:'🌙',
    title:'La fille de mes rêves',
    body:`<p class="popup-body">Tu es peut-être la fille de mes rêves. Et ce rêve-là, je le garde précieusement. 💗</p>
    <div class="popup-divider"></div>
    <p class="popup-body center" style="text-align:center;font-style:italic;font-size:0.82rem;color:rgba(255,214,238,0.85);">"Dans toute la galaxie, c'est toi que j'aurais choisie."</p>`,
    label:'Message IV'
  },
  {
    icon:'🌸',
    title:'Pour ta nouvelle année',
    body:`<p class="popup-body">Que cette nouvelle année t'apporte tout ce que tu mérites — la joie, la santé, l'amour, et toutes les étoiles de cette galaxie. 🌟</p>
    <div class="popup-divider"></div>
    <p class="popup-body" style="text-align:center;font-size:0.83rem;color:rgba(255,214,238,0.88);">Bonne fête, Marcello. Tu mérites tout le bien de cet univers. 🌌</p>
    <div class="popup-signature">— Brightson 💫</div>`,
    label:'Message V',
    last:true
  },
  PHOTO_1,
  PHOTO_2
];

// ═══════════════════════════════════════════════════════
// CANVAS + GALAXY SETUP
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('worldCanvas');
const ctx    = canvas.getContext('2d');

// World is larger than viewport for panning
const WORLD_W = 2200;
const WORLD_H = 1600;
canvas.width  = WORLD_W;
canvas.height = WORLD_H;
canvas.style.width  = WORLD_W + 'px';
canvas.style.height = WORLD_H + 'px';

const WCX = WORLD_W / 2;
const WCY = WORLD_H / 2;

const RM = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

// Stars scattered across world
const stars = Array.from({length:320},()=>({
  x:Math.random()*WORLD_W, y:Math.random()*WORLD_H,
  r:Math.random()*1.5+0.2, tw:Math.random()*Math.PI*2,
  col:Math.random()<0.12?'255,215,112':'255,255,255'
}));

// Galaxy particles
const ARMS=3, NG=1100, TILT=0.30, RS=0.00065;
const gp = Array.from({length:NG},(_,i)=>{
  const arm=i%ARMS, t=Math.pow(Math.random(),0.65);
  const R=18+t*(Math.min(WORLD_W,WORLD_H)*0.44);
  const a0=(arm/ARMS)*Math.PI*2+t*5.4+(Math.random()-0.5)*0.5;
  return{R,t,angle:a0,sf:0.5+(1-t)*0.95,sz:Math.random()*1.8+0.3,warm:Math.random()<0.62,tw:Math.random()*Math.PI*2};
});

// Heart fountain
function hPt(t){return{x:16*Math.pow(Math.sin(t),3),y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))};}
const HS=Math.min(WORLD_W,WORLD_H)*0.012, NHP=600;
const heartP=Array.from({length:NHP},(_,i)=>{
  const fill=i%3===0,t=(i/NHP)*Math.PI*2+Math.random()*0.06,pt=hPt(t),sc=fill?(0.25+Math.random()*0.65):1;
  return{tx:pt.x*HS*sc,ty:pt.y*HS*sc,prog:Math.random(),spd:0.012+Math.random()*0.014,sz:Math.random()*2.5+0.6,warm:Math.random()<0.55};
});
const heartTop = WCY - Math.min(WORLD_W,WORLD_H)*0.41;

// Extra star clusters at message positions (drawn once world is laid out)
const MSG_POSITIONS = [
  {wx: WCX + 480,  wy: WCY - 260},   // 1
  {wx: WCX - 420,  wy: WCY + 180},   // 2
  {wx: WCX + 200,  wy: WCY + 340},   // 3
  {wx: WCX - 180,  wy: WCY - 340},   // 4
  {wx: WCX + 20,   wy: WCY - 60},    // 5  (near core)
  {wx: WCX - 550,  wy: WCY - 180},   // PHOTO 1
  {wx: WCX + 350,  wy: WCY + 420}    // PHOTO 2
];

let frame=0,lastT=performance.now();

function drawGalaxy(now){
  const dt=Math.min(now-lastT,50);lastT=now;frame++;
  ctx.clearRect(0,0,WORLD_W,WORLD_H);

  // bg
  ctx.fillStyle='#040009';
  ctx.fillRect(0,0,WORLD_W,WORLD_H);

  // stars
  stars.forEach(s=>{
    const tw=0.4+0.6*Math.sin(frame*0.025+s.tw);
    ctx.beginPath();ctx.fillStyle=`rgba(${s.col},${0.1+tw*0.4})`;
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });

  // nebula clouds at message positions
  MSG_POSITIONS.forEach((mp,i)=>{
    const pulse=0.5+0.5*Math.sin(frame*0.025+i*1.3);
    const ng=ctx.createRadialGradient(mp.wx,mp.wy,0,mp.wx,mp.wy,90+pulse*20);
    ng.addColorStop(0,`rgba(255,45,138,${0.06+pulse*0.04})`);
    ng.addColorStop(0.5,`rgba(160,32,240,${0.03+pulse*0.02})`);
    ng.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ng;ctx.fillRect(mp.wx-120,mp.wy-120,240,240);
  });

  // ambient glow
  const ag=ctx.createRadialGradient(WCX,WCY,0,WCX,WCY,WORLD_H*0.55);
  ag.addColorStop(0,'rgba(130,8,85,0.42)');
  ag.addColorStop(0.45,'rgba(68,4,60,0.16)');
  ag.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ag;ctx.fillRect(0,0,WORLD_W,WORLD_H);

  // galaxy particles
  ctx.globalCompositeOperation='lighter';
  gp.slice().sort((a,b)=>Math.sin(a.angle)-Math.sin(b.angle)).forEach(p=>{
    if(!RM)p.angle+=RS*p.sf*dt;
    const x=WCX+Math.cos(p.angle)*p.R,y=WCY+Math.sin(p.angle)*p.R*TILT;
    const tw=0.5+0.5*Math.sin(frame*0.065+p.tw),nr=1-p.t;
    const r=p.warm?255:210,g=p.warm?Math.floor(52+nr*68):Math.floor(90+nr*50),b=p.warm?Math.floor(128+nr*75):255;
    const al=(0.15+tw*0.52)*(0.46+nr*0.64);
    ctx.beginPath();ctx.fillStyle=`rgba(${r},${g},${b},${Math.min(al,0.88)})`;
    ctx.arc(x,y,p.sz,0,Math.PI*2);ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';

  // arm streaks
  ctx.globalCompositeOperation='lighter';
  for(let a=0;a<ARMS;a++){
    ctx.beginPath();
    const ao=(a/ARMS)*Math.PI*2+frame*RS*18;
    for(let t2=0;t2<=1;t2+=0.022){
      const R2=18+t2*(Math.min(WORLD_W,WORLD_H)*0.44),an=ao+t2*5.4;
      const x=WCX+Math.cos(an)*R2,y=WCY+Math.sin(an)*R2*TILT;
      t2===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(255,100,180,0.065)';
    ctx.lineWidth=Math.min(WORLD_W,WORLD_H)*0.052;ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';

  // core halo
  const cR=Math.min(WORLD_W,WORLD_H)*0.022;
  ctx.globalCompositeOperation='lighter';
  const hg=ctx.createRadialGradient(WCX,WCY,0,WCX,WCY,cR*5.5);
  hg.addColorStop(0,'rgba(255,255,255,0.98)');hg.addColorStop(0.1,'rgba(255,180,220,0.88)');
  hg.addColorStop(0.32,'rgba(255,45,150,0.45)');hg.addColorStop(1,'rgba(255,45,150,0)');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(WCX,WCY,cR*5.5,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(WCX,WCY,cR,cR*0.8,0,0,Math.PI*2);ctx.fill();

  // jet + heart
  ctx.globalCompositeOperation='lighter';
  const jg=ctx.createLinearGradient(WCX,WCY,WCX,heartTop);
  jg.addColorStop(0,'rgba(255,230,245,0.6)');jg.addColorStop(1,'rgba(255,160,210,0.04)');
  ctx.fillStyle=jg;ctx.beginPath();
  ctx.moveTo(WCX-cR*0.45,WCY);ctx.lineTo(WCX+cR*0.45,WCY);
  ctx.lineTo(WCX+cR*0.1,heartTop);ctx.lineTo(WCX-cR*0.1,heartTop);
  ctx.closePath();ctx.fill();
  heartP.forEach(p=>{
    if(!RM){p.prog+=p.spd*0.5;if(p.prog>1)p.prog=0;}
    const e=p.prog,ry=WCY-e*(WCY-heartTop+8),s=Math.max(0,e-0.44)/0.56;
    const fy=heartTop+p.ty*s+(1-s)*(ry-heartTop),wb=(1-s)*Math.sin(frame*0.12+p.tx)*1.8;
    const x=WCX+p.tx*s+wb,al=0.28+s*0.72,hu=p.warm?'255,145,200':'255,255,255';
    ctx.beginPath();ctx.fillStyle=`rgba(${hu},${al})`;ctx.arc(x,fy,p.sz,0,Math.PI*2);ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';

  requestAnimationFrame(drawGalaxy);
}
requestAnimationFrame(drawGalaxy);

// ═══════════════════════════════════════════════════════
// VIEWPORT / PAN SYSTEM
// ═══════════════════════════════════════════════════════
const stageEl = document.getElementById('stage');
let VW = window.innerWidth, VH = window.innerHeight;

// camera position (top-left of viewport in world coords)
// start centered on galaxy core
let camX = WCX - VW/2;
let camY = WCY - VH/2;

// clamp camera
function clampCam(){
  camX = Math.max(0, Math.min(WORLD_W - VW, camX));
  camY = Math.max(0, Math.min(WORLD_H - VH, camY));
}
clampCam();

// apply camera to world canvas position
function applyCam(){
  canvas.style.left = -camX + 'px';
  canvas.style.top  = -camY + 'px';
}
applyCam();

// pan state
let isDragging=false, dragStartX=0, dragStartY=0, camStartX=0, camStartY=0;
let velX=0, velY=0, lastMoveX=0, lastMoveY=0, lastMoveT=0;
let hasMoved=false;

// touch/mouse
function onDown(ex,ey){
  isDragging=true; hasMoved=false;
  dragStartX=ex; dragStartY=ey;
  camStartX=camX; camStartY=camY;
  velX=0; velY=0;
  lastMoveX=ex; lastMoveY=ey; lastMoveT=performance.now();
  stageEl.classList.add('dragging');
}
function onMove(ex,ey){
  if(!isDragging)return;
  const dx=ex-dragStartX, dy=ey-dragStartY;
  if(Math.abs(dx)+Math.abs(dy)>4) hasMoved=true;
  const now=performance.now();
  velX=(ex-lastMoveX)/(now-lastMoveT+1)*16;
  velY=(ey-lastMoveY)/(now-lastMoveT+1)*16;
  lastMoveX=ex; lastMoveY=ey; lastMoveT=now;
  camX=camStartX-dx; camY=camStartY-dy;
  clampCam(); applyCam(); updateNodePositions();
}
function onUp(){ isDragging=false; stageEl.classList.remove('dragging'); startInertia(); }

stageEl.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
window.addEventListener('mousemove', e=>{ if(isDragging) onMove(e.clientX,e.clientY); });
window.addEventListener('mouseup', onUp);

stageEl.addEventListener('touchstart', e=>{ const t=e.touches[0]; onDown(t.clientX,t.clientY); },{passive:true});
stageEl.addEventListener('touchmove', e=>{ const t=e.touches[0]; onMove(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
stageEl.addEventListener('touchend', onUp);

// inertia
let inertiaRaf=null;
function startInertia(){
  if(inertiaRaf) cancelAnimationFrame(inertiaRaf);
  function step(){
    velX*=0.92; velY*=0.92;
    if(Math.abs(velX)<0.3 && Math.abs(velY)<0.3) return;
    camX-=velX; camY-=velY;
    clampCam(); applyCam(); updateNodePositions();
    inertiaRaf=requestAnimationFrame(step);
  }
  inertiaRaf=requestAnimationFrame(step);
}

// smooth travel to world pos
function travelTo(wx,wy,duration=900){
  const targetCX=wx-VW/2, targetCY=wy-VH/2;
  const startCX=camX, startCY=camY;
  const startT=performance.now();
  function step(now){
    const p=Math.min((now-startT)/duration,1);
    const ease=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    camX=startCX+(targetCX-startCX)*ease;
    camY=startCY+(targetCY-startCY)*ease;
    clampCam(); applyCam(); updateNodePositions();
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

window.addEventListener('resize',()=>{
  VW=window.innerWidth; VH=window.innerHeight;
  clampCam(); applyCam(); updateNodePositions();
});

// ═══════════════════════════════════════════════════════
// MESSAGE NODES (floating in world)
// ═══════════════════════════════════════════════════════
const nodesLayer = document.getElementById('nodesLayer');
const readSet = new Set();
const readMessages = new Set();
let messagesReadCount = 0;

const NODE_NUMERALS = ['①','②','③','④','⑤'];

const nodeEls = MSG_POSITIONS.map((mp,i)=>{
  const wrapper = document.createElement('div');
  wrapper.className='msg-node';
  wrapper.id=`node${i}`;
  if(MESSAGES[i].isPhoto){
    wrapper.classList.add('locked');
    wrapper.style.pointerEvents='none';
    wrapper.style.visibility='hidden';
    wrapper.setAttribute('aria-disabled','true');
  }
  wrapper.innerHTML=`
    <div class="node-orb">
      <span class="node-num">${MESSAGES[i].isPhoto ? '📷' : NODE_NUMERALS[i]}</span>
      <div class="node-check">✓</div>
    </div>
    <div class="node-label">${MESSAGES[i].label}</div>
  `;
  nodesLayer.appendChild(wrapper);

  // click / tap
  wrapper.addEventListener('click', e=>{
    if(hasMoved) return;
    if(MESSAGES[i].isPhoto && readMessages.size < 5) return;
    openMessage(i);
  });
  wrapper.addEventListener('touchend', e=>{
    if(hasMoved) return;
    if(MESSAGES[i].isPhoto && readMessages.size < 5) return;
    e.preventDefault();
    openMessage(i);
  });

  return wrapper;
});

function unlockPhotos(){
  nodeEls.forEach((node,i)=>{
    if(MESSAGES[i].isPhoto){
      node.classList.remove('locked');
      node.style.pointerEvents='auto';
      node.style.visibility='visible';
      node.removeAttribute('aria-disabled');
    }
  });
}

function worldToScreen(wx,wy){
  return { sx: wx - camX, sy: wy - camY };
}

function updateNodePositions(){
  MSG_POSITIONS.forEach((mp,i)=>{
    const {sx,sy}=worldToScreen(mp.wx,mp.wy);
    nodeEls[i].style.left = sx+'px';
    nodeEls[i].style.top  = sy+'px';
    // fade out nodes that are far off-screen
    const offX=Math.abs(sx-VW/2), offY=Math.abs(sy-VH/2);
    const vis=Math.max(0,1-Math.max(offX-VW*0.55,offY-VH*0.55)/200);
    nodeEls[i].style.opacity=vis.toFixed(2);
  });
}
updateNodePositions();

// ═══════════════════════════════════════════════════════
// ORBIT LABELS (follow world, positioned on canvas)
// ═══════════════════════════════════════════════════════
const OTEXTS=['JOYEUX ANNIVERSAIRE','MARCELLO GERMINA','19 SEPTEMBRE','MA MEILLEURE AMIE',
  'TU ES SPÉCIALE','LA FILLE DE MES RÊVES','AVEC TOUT MON CŒUR','TU ES MAGIE',
  'NOTRE UNIVERS','HAPPY BIRTHDAY','TU ME FAIS SOURIRE','TOUJOURS LÀ POUR TOI'];
const olHost=document.getElementById('orbitLabels');
const OTILT=0.30;
const olabels=OTEXTS.map((txt,i)=>{
  const el=document.createElement('div');el.className='olabel';el.textContent=txt;
  olHost.appendChild(el);
  return{el,angle:(i/OTEXTS.length)*Math.PI*2+(Math.random()-0.5)*0.1,rf:0.55+((i%4)*0.075),sf:0.44+((i%3)*0.2)};
});
const ORBIT_R_BASE = Math.min(WORLD_W,WORLD_H)*0.42;
let lastOT=performance.now();
function labelLoop(now){
  const dt=Math.min(now-lastOT,50);lastOT=now;
  olabels.forEach(l=>{
    if(!RM) l.angle+=RS*l.sf*dt*0.55;
    const R=ORBIT_R_BASE*l.rf;
    const wx=WCX+Math.cos(l.angle)*R;
    const wy=WCY+Math.sin(l.angle)*R*OTILT;
    const {sx,sy}=worldToScreen(wx,wy);
    const dep=(Math.sin(l.angle)+1)/2;
    const ef=(sx<-20||sx>VW+20||sy<-20||sy>VH+20)?0:1;
    l.el.style.left=sx+'px'; l.el.style.top=sy+'px';
    l.el.style.opacity=(ef*(0.18+dep*0.6)).toFixed(2);
    l.el.style.fontSize=(0.5+dep*0.18)+'rem';
    l.el.style.transform=`translate(-50%,-50%) scale(${0.72+dep*0.32})`;
    l.el.style.zIndex=dep>0.5?3:0;
  });
  requestAnimationFrame(labelLoop);
}
requestAnimationFrame(labelLoop);

// ═══════════════════════════════════════════════════════
// FLOATING PETALS
// ═══════════════════════════════════════════════════════
const phost=document.getElementById('petalsLayer');
['🌸','💗','✨','💖','🌺','💕','⭐','🌷'].forEach((g,i)=>{
  const el=document.createElement('div');el.className='petal';el.textContent=g;
  el.style.cssText=`
    left:${Math.random()*100}%;bottom:-6%;
    animation-duration:${9+Math.random()*10}s;
    animation-delay:${Math.random()*14}s;
    font-size:${0.82+Math.random()*1.1}rem;
    position:fixed;pointer-events:none;z-index:2;
  `;
  phost.appendChild(el);
});

// ═══════════════════════════════════════════════════════
// POPUP
// ═══════════════════════════════════════════════════════
const popup   = document.getElementById('popup');
const popupCard = popup.querySelector('.popup-card');
const popIcon  = document.getElementById('popIcon');
const popNum   = document.getElementById('popNum');
const popTitle = document.getElementById('popTitle');
const popBody  = document.getElementById('popBody');
const popNav   = document.getElementById('popNav');

let currentOpen = -1;

function openMessage(i){
  const msg=MESSAGES[i];
  if(msg.isPhoto && readMessages.size < 5) return;
  popupCard.classList.toggle('photo-popup-card', !!msg.isPhoto);
  popIcon.textContent=msg.isPhoto ? '📷' : msg.icon;
  popNum.textContent=`${msg.label} · ${i+1} / ${MESSAGES.length}`;
  popTitle.textContent=msg.title;
  if(msg.isPhoto && msg.photo){
    popBody.innerHTML=`<img class="photo-popup-image" src="${msg.photo}" alt="${msg.title}">${msg.body}`;
    const photoImage=popBody.querySelector('.photo-popup-image');
    photoImage.addEventListener('error',()=>{
      const errorMessage=document.createElement('p');
      errorMessage.className='popup-body';
      errorMessage.textContent='Cette photo est momentanément indisponible.';
      photoImage.replaceWith(errorMessage);
    },{once:true});
  } else {
    popBody.innerHTML=msg.body;
  }

  popNav.innerHTML='';
  // prev
  if(i>0){
    const b=document.createElement('button');
    b.className='btn-pop';b.textContent='← Précédent';
    b.addEventListener('click',()=>{closeMessage();setTimeout(()=>{ travelToNode(i-1); setTimeout(()=>openMessage(i-1),700); },300);});
    popNav.appendChild(b);
  }
  // close
  const bc=document.createElement('button');
  bc.className='btn-pop';bc.textContent='✕ Fermer';
  bc.addEventListener('click',closeMessage);
  popNav.appendChild(bc);
  // next / restart
  if(!msg.last && i < MESSAGES.length - 1){
    const bn=document.createElement('button');
    bn.className='btn-pop primary';bn.textContent='Suivant →';
    bn.addEventListener('click',()=>{closeMessage();setTimeout(()=>{ travelToNode(i+1); setTimeout(()=>openMessage(i+1),700); },300);});
    popNav.appendChild(bn);
  } else {
    const br=document.createElement('button');
    br.className='btn-pop primary';br.textContent='🌸 Revenir au début';
    br.addEventListener('click',()=>{closeMessage();setTimeout(()=>travelTo(WCX,WCY,1100),300);});
    popNav.appendChild(br);
  }

  popup.classList.add('show');
  currentOpen=i;

  // mark as read
  if(!msg.isPhoto){
    readMessages.add(i);
    messagesReadCount=readMessages.size;
    if(messagesReadCount >= 5) unlockPhotos();
  }
  readSet.add(i);
  nodeEls[i].classList.add('read');
  updateDots();
}

function closeMessage(){
  popup.classList.remove('show');
  currentOpen=-1;
}

popup.addEventListener('click',e=>{ if(e.target===popup) closeMessage(); });

// ═══════════════════════════════════════════════════════
// TRAVEL TO NODE
// ═══════════════════════════════════════════════════════
function travelToNode(i){
  travelTo(MSG_POSITIONS[i].wx, MSG_POSITIONS[i].wy, 900);
}

// ═══════════════════════════════════════════════════════
// PROGRESS DOTS
// ═══════════════════════════════════════════════════════
const pdots=[1,2,3,4,5].map(n=>document.getElementById('pd'+n));
function updateDots(){
  pdots.forEach((d,i)=>d.classList.toggle('done',readSet.has(i)));
}

// ═══════════════════════════════════════════════════════
// HOME → EXPLORE
// ═══════════════════════════════════════════════════════
const homeOverlay = document.getElementById('homeOverlay');
const hint        = document.getElementById('hint');
const progressEl  = document.getElementById('progress');

document.getElementById('btnExplore').addEventListener('click',()=>{
  homeOverlay.classList.add('hiding');
  setTimeout(()=>homeOverlay.classList.add('gone'),850);

  // fly to first message
  setTimeout(()=>{
    travelToNode(0);
    hint.classList.add('show');
    progressEl.classList.add('show');
    // hide hint after 5s
    setTimeout(()=>hint.classList.remove('show'),5000);
  },400);
});

})();
</script>
